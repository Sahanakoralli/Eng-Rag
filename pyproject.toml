[project]
name = "engrag"
version = "0.1.0"
description = "RAG pipeline for engineering documents"
requires-python = ">=3.10"

[project.scripts]
engrag = "engrag.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
